<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELAY</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="/assets/relay.css">
<style>
  /* 이 파일은 레이아웃·색·여백만 다룬다.
     글자 크기·행간·자간·굵기는 /assets/relay.css 의 역할 배정표가 정한다. */
  :root{ --fs-display:clamp(32px,4.5vw,46px) }

  .bar{position:sticky;top:0;background:rgba(245,245,247,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:10}
  .bar-inner{max-width:1180px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .back{display:inline-flex;align-items:center;gap:9px;color:var(--ink);cursor:pointer;background:none;border:0;font-family:var(--sans);transition:color .15s}
  .back:hover{color:var(--accent)}
  .ai-chip{display:inline-flex;align-items:center;gap:7px;color:var(--ink-faint);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
  .ai-chip b{color:var(--accent);font-weight:700}
  .progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}

  /* 텍스트 폭 824px + 본문 18px = 한 줄 약 43자 (한글 적정 구간 35~45자) */
  /* 모델 ID·파일명(minimax_h3_..._bf16.safetensors 등)은 줄바꿈 지점이 없어 좁은 화면에서 폭을 밀어낸다 */
  .article{max-width:920px;margin:0 auto;padding:76px 48px 140px;overflow-wrap:break-word}
  .article .cat{display:block;color:var(--accent);margin-bottom:22px}
  .article h1{margin-bottom:26px}
  .lede{color:var(--ink-soft);margin-bottom:30px}
  .byline{display:flex;gap:20px;flex-wrap:wrap;color:var(--ink-faint);padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .byline .src{color:var(--ink-soft);font-weight:600}
  .summary-box{background:var(--paper-2);border-left:2px solid var(--accent);padding:22px 26px;margin:36px 0 44px;border-radius:0 6px 6px 0}
  .summary-box .st{display:block;color:var(--accent);margin-bottom:10px}
  .summary-box p{color:var(--ink-soft);line-height:var(--lh-relaxed)}

  .body p{color:var(--ink);margin-bottom:30px}
  .body h2{margin:48px 0 20px}
  .body h3{margin:16px 0 20px}
  .body strong{font-weight:700}
  .body code{font-family:var(--mono);font-size:.88em;background:var(--paper-2);padding:2px 6px;border-radius:4px}
  .body ul{list-style:none;margin:0 0 30px;padding:0}
  .body li{position:relative;color:var(--ink);padding-left:24px;margin-bottom:14px}
  /* 불릿은 첫 줄의 글자 중심에 맞춘다 */
  .body li::before{content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;background:var(--accent);border-radius:1px}
  .endmark{margin-top:100px;padding-top:32px;border-top:1px solid var(--line);color:var(--ink-mute);display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
  .src-link{color:var(--ink-faint);cursor:pointer;transition:color .15s}
  .src-link:hover{color:var(--accent)}

  .cover{margin:30px 0 8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper-2);aspect-ratio:16/9;display:block}
  .cover img{width:100%;height:100%;display:block;object-fit:cover}
  .cap{color:var(--ink-faint);margin:10px 0 0;padding-left:2px}
  .cap b{color:var(--ink-soft);font-weight:600}
  /* 출처는 설명과 같은 덩어리다. 줄만 바꾸고 크기는 그대로, 명도만 한 단계 뒤로. */
  .credit{display:block;margin-top:5px;color:var(--ink-mute)}
  figure{margin:40px 0}
  figure .frame{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper-2)}
  figure img{width:100%;display:block}
  figcaption{color:var(--ink-faint);margin:10px 0 0;padding-left:2px}
  figcaption b{color:var(--ink-soft);font-weight:600}
  figure video{width:100%;display:block}

  /* ── 데일리 리포트 확장 (라벨→제목 위계, 항목별 출처, 섹션 구분) ── */
  /* 항목 시작 표시: 짧은 틱 + 큰 상단 여백. 그룹의 전폭 구분선과 층이 갈린다. */
  .body .kick{position:relative;display:block;color:var(--accent);margin:112px 0 12px;padding-top:18px}
  .body .kick::before{content:"";position:absolute;left:0;top:0;width:24px;height:2px;background:var(--accent);opacity:.45}
  .body > .kick:first-child{margin-top:6px}
  .body .kick + h2,.body .kick + h3{margin-top:0}
  /* 그룹은 항목보다 한 층 위다 — 전폭 구분선과 큰 여백, 그리고 한 단 큰 글자 */
  .body .group{margin:124px 0 10px;padding-top:32px;border-top:1px solid var(--line);color:var(--accent)}
  /* 첫 그룹 위에는 나눌 대상이 없으므로 구분선과 큰 여백을 뺀다 */
  .body > .group:first-child{margin-top:0;padding-top:0;border-top:0}
  /* 그룹의 첫 항목은 그룹 라벨이 이미 경계를 표시하므로 틱을 겹쳐 두지 않는다 */
  .body .group + .kick{margin-top:30px;padding-top:0}
  .body .group + .kick::before{display:none}
  /* 출처 줄은 본문보다 한 단계 낮은 명도로 눌러 두고, 마지막 문단에 바짝 붙여 항목을 닫는다 */
  .body .src-line{color:var(--ink-mute);margin:-18px 0 0}
  .body .src-line b{color:var(--ink-mute);font-weight:600;margin-right:5px}
  /* 이 줄의 링크는 유일한 클릭 지점이므로 밑줄을 상시 켜 둔다 */
  .body .src-line a{color:var(--ink-faint);border-bottom:1px solid var(--line);transition:color .15s,border-color .15s}
  .body .src-line a:hover{color:var(--accent);border-bottom-color:var(--accent)}

  .reveal{opacity:0;transform:translateY(14px);animation:rise .7s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  .notfound{max-width:800px;margin:0 auto;padding:120px 40px;text-align:center;color:var(--ink-faint)}
  .notfound a{color:var(--accent);font-weight:600}

  @media(max-width:820px){
    .bar-inner,.article{padding-left:22px;padding-right:22px}
    .article{padding-top:48px}
    /* 좁은 화면에서는 데스크톱 간격이 과하므로 한 단계씩 줄인다 */
    .body p{margin-bottom:26px}
    figure{margin:32px 0}
    .body .kick{margin-top:80px;padding-top:15px}
    .body .group{margin-top:96px;padding-top:28px}
    .body .group + .kick{margin-top:24px}
    .body .src-line{margin-top:-16px}
    .endmark{margin-top:72px}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-inner">
    <a class="back" href="/">← 아카이브로</a>
    <span class="brand">RELAY</span>
    <span class="ai-chip"><b>AI</b> SUMMARY</span>
  </div>
  <div class="progress" id="prog"></div>
</div>

<article class="article" id="article"></article>

<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const root = document.getElementById('article');

  load();
  async function load(){
    if(!id){ notFound(); return; }
    let a;
    try{
      const res = await fetch('data/posts/' + encodeURIComponent(id) + '.json', {cache:'no-cache'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      a = await res.json();
    }catch(err){
      console.error(err);
      notFound();
      return;
    }
    renderArticle(a);
  }

  function notFound(){
    root.outerHTML = '<div class="notfound">글을 찾을 수 없습니다. <a href="/">아카이브로 돌아가기</a></div>';
  }

  const kick = b => b.kicker ? `<span class="kick">${b.kicker}</span>` : '';

  function renderBlock(b){
    switch(b.type){
      case 'lede':  return `<p class="lede">${b.html||b.text||''}</p>`;
      case 'p':     return `<p>${b.html||b.text||''}</p>`;
      case 'h2':    return `${kick(b)}<h2>${b.text||''}</h2>`;
      case 'h3':    return `${kick(b)}<h3>${b.text||''}</h3>`;
      // 그룹은 항목(h3)을 포함하는 상위 절이므로 의미상 h2다. 크기는 .group 클래스가 라벨로 유지.
      case 'group': return `<h2 class="group">${b.text||''}</h2>`;
      case 'ul':    return `<ul>${(b.items||[]).map(i=>`<li>${i}</li>`).join('')}</ul>`;
      case 'figure':{
        const media = b.video
          ? `<video controls muted playsinline preload="metadata" src="${b.video}" onerror="this.closest('figure').style.display='none'"></video>`
          : `<img src="${b.img}" alt="${b.alt||''}" loading="lazy" onerror="this.closest('figure').style.display='none'">`;
        return `<figure class="reveal"><div class="frame">${media}</div>`+
               `<figcaption>${b.caption||''}${b.credit?`<span class="credit">${b.credit}</span>`:''}</figcaption></figure>`;
      }
      case 'src':{
        const links = (b.links||[]).map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.t}</a>`).join(' · ');
        return `<div class="src-line"><b>출처:</b> ${b.html||links}</div>`;
      }
      default:      return '';
    }
  }

  function renderArticle(a){
    document.title = 'RELAY — ' + a.title;
    const cover = a.cover ? `
      <div class="cover reveal" style="animation-delay:.12s">
        <img src="${a.cover.img}" alt="${a.cover.alt||''}" loading="lazy" onerror="this.parentElement.style.display='none'">
      </div>
      <div class="cap reveal" style="animation-delay:.13s">${a.cover.caption||''}${a.cover.credit?`<span class="credit">${a.cover.credit}</span>`:''}</div>` : '';
    const lede = a.lede ? `<p class="lede reveal" style="animation-delay:.18s">${a.lede}</p>` : '';
    const src = a.sourceUrl
      ? `<a class="src-link" href="${a.sourceUrl}" target="_blank" rel="noopener">원문 보기 — ${a.source} ↗</a>`
      : `<span class="src-link">${a.source}</span>`;

    root.innerHTML = `
      <span class="cat reveal">${a.category}</span>
      <h1 class="reveal" style="animation-delay:.05s">${a.title}</h1>
      <div class="byline reveal" style="animation-delay:.1s">
        <span class="src">${a.source}</span><span>${a.date}</span><span>읽기 ${a.read||''}</span>
      </div>
      ${cover}
      <div class="summary-box reveal" style="animation-delay:.15s">
        <div class="st">AI 한 줄 요약</div><p>${a.summary}</p>
      </div>
      <div class="body reveal" style="animation-delay:.2s">
        ${lede}
        ${(a.body||[]).map(renderBlock).join('')}
        <div class="endmark">
          <span>RELAY — Automated Reading Archive</span>
          ${src}
        </div>
      </div>`;
  }

  addEventListener('scroll',()=>{
    const h=document.documentElement.scrollHeight-innerHeight;
    document.getElementById('prog').style.width=(h>0?scrollY/h*100:0)+'%';
  });
</script>
</body>
</html>
